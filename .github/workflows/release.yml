name: Build and Release MODBUS-SERVER

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.0.0)'
        required: true
      core_sdk_version:
        description: 'Core SDK version'
        required: false
        default: '1.1.0'
      build_qt5:
        description: 'Also build Qt5 legacy'
        type: boolean
        default: false

jobs:
  release:
    uses: dimgrig/CoreCI/.github/workflows/release-template.yml@master
    with:
      app_name: modbus-server
      release_title: MODBUS-SERVER
      core_sdk_version: ${{ inputs.core_sdk_version || '1.1.0' }}
      platforms_qt6: 'linux-qt6 win-qt6'
      platforms_qt5: ${{ inputs.build_qt5 && 'linux-qt5 win-qt5' || '' }}
      upload_artifacts: true
      publish_release: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read